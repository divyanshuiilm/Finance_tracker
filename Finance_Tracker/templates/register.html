<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Student Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main>
      <section style="max-width: 480px; margin: 3rem auto;">
        <h1>Create your account</h1>
        <p class="muted">Start tracking your personal finances securely.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <p>
            <label for="username">Username</label><br>
            <input id="username" name="username" autocomplete="username" required minlength="3">
          </p>
          <p>
            <label for="password">Password</label><br>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <br><small class="muted">Minimum 8 characters.</small>
          </p>
          <p>
            <label for="confirmation">Confirm password</label><br>
            <input id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
          </p>
          <button type="submit">Create account</button>
          <p class="muted" style="margin-top: 1.25rem;">
            Already have an account? <a href="{{ url_for('login') }}">Log in here</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
