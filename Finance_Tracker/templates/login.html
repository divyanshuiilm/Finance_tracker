<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Student Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main>
      <section style="max-width: 480px; margin: 3rem auto;">
        <h1>Welcome back</h1>
        <p class="muted">Log in to access your personal finance manager.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <p>
            <label for="username">Username</label><br>
            <input id="username" name="username" autocomplete="username" required>
          </p>
          <p>
            <label for="password">Password</label><br>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </p>
          <button type="submit">Log in</button>
          <p class="muted" style="margin-top: 1.25rem;">
            Don't have an account? <a href="{{ url_for('register') }}">Create an account</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
