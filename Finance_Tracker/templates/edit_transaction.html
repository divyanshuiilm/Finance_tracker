<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit transaction | Student Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}">Student Finance Manager</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('home') }}">Dashboard</a>
        <a href="{{ url_for('transactions') }}">Transactions</a>
        <a href="{{ url_for('budgets') }}">Budgets</a>
        <a href="{{ url_for('goals') }}">Goals</a>
        <a href="{{ url_for('recurring_transactions') }}">Recurring</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="{{ url_for('debts') }}">Borrowed/lent</a>
        <a href="{{ url_for('analytics') }}">Analytics</a>
        <a href="{{ url_for('logout') }}">Log out</a>
      </nav>
    </header>
    <main>
      <p><a href="{{ url_for('transactions') }}">← Back to transactions</a></p>
      <h1>Edit transaction</h1>

      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post">
        <p>
          <label for="transaction_type">Type</label><br>
          <select id="transaction_type" name="transaction_type" required>
            <option value="expense" {% if transaction['transaction_type'] == 'expense' %}selected{% endif %}>Expense</option>
            <option value="income" {% if transaction['transaction_type'] == 'income' %}selected{% endif %}>Income</option>
          </select>
        </p>
        <p>
          <label for="amount">Amount (₹)</label><br>
          <input id="amount" name="amount" type="number" min="0.01" step="0.01" value="{{ transaction['amount'] }}" required>
        </p>
        <p>
          <label for="transaction_date">Date</label><br>
          <input id="transaction_date" name="transaction_date" type="date" value="{{ transaction['transaction_date'] }}" required>
        </p>
        <p>
          <label for="category">Category</label><br>
          <select id="category" name="category" required>
            {% for option in ['Food', 'Transport', 'College', 'Entertainment', 'Shopping', 'Bills', 'Health', 'Investment', 'Savings', 'Other'] %}
              <option value="{{ option }}" {% if transaction['category'] == option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="payment_method">Payment method</label><br>
          <select id="payment_method" name="payment_method" required>
            {% for option in ['UPI', 'Cash', 'Card', 'Bank', 'Other'] %}
              <option value="{{ option }}" {% if transaction['payment_method'] == option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label for="merchant">Merchant or person (optional)</label><br>
          <input id="merchant" name="merchant" type="text" value="{{ transaction['merchant'] or '' }}">
        </p>
        <p>
          <label for="note">Note (optional)</label><br>
          <textarea id="note" name="note" rows="3">{{ transaction['note'] or '' }}</textarea>
        </p>
        <button type="submit">Save changes</button>
      </form>
    </main>
  </body>
</html>
