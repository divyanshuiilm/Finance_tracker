<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set up account | Student Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main>
      <section>
        <h1>Protect your finance manager</h1>
        <p class="muted">Create the local account that unlocks this app on your computer.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
          <p><label for="username">Username</label><br><input id="username" name="username" autocomplete="username" required></p>
          <p><label for="password">Password</label><br><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></p>
          <p><label for="confirmation">Confirm password</label><br><input id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required></p>
          <button type="submit">Create account</button>
        </form>
      </section>
    </main>
  </body>
</html>
